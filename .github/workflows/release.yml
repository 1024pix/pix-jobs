name: release

on:
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: dashboard
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: 'dashboard/package.json'

            - uses: 1024pix/pix-actions/release@481ebcb7bd39fcf913121fa594c6722f9c5f7988 # main
              id: semantic
              with:
                  changelogTitle: '# Pix Jobs Dashboard Changelog'
              env:
                  GITHUB_TOKEN: ${{ secrets.PIX_SERVICE_ACTIONS_TOKEN }}
